[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kltn-management-db"
version = "0.1.0"
description = "Mô hình và migration PostgreSQL cho hệ thống quản lý KLTN"
requires-python = ">=3.9"
dependencies = [
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
  "argon2-cffi>=25.1,<26",
  "itsdangerous>=2.2,<3",
  "qdrant-client>=1.12,<2",
  "fastembed>=0.7,<1",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "openapi-spec-validator>=0.7,<1", "Pillow>=10,<13"]
sso = ["Authlib>=1.8,<2", "httpx2>=1,<2"]
