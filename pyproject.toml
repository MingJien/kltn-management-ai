[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kltn-management-db"
version = "0.1.0"
description = "Mô hình và migration PostgreSQL cho hệ thống quản lý KLTN"
requires-python = ">=3.9"
dependencies = [
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
include = ["backend*"]
