  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "responses": {
      "Unauthorized": {
        "description": "Chưa xác thực hoặc token không hợp lệ",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Forbidden": {
        "description": "Không có quyền ngữ cảnh",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "NotFound": {
        "description": "Không tồn tại hoặc không được phép phát hiện",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Conflict": {
        "description": "Xung đột trạng thái, version hoặc invariant",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "ValidationError": {
        "description": "Dữ liệu hoặc business rule không hợp lệ",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "details": {
            "type": [
              "object",
              "null"
            ],
            "additionalProperties": true
          }
        }
      },
      "ObjectResult": {
        "type": "object",
        "description": "Đối tượng kết quả; schema chi tiết được module triển khai khóa trước Week 3.",
        "additionalProperties": true
      },
      "CommandPayload": {
        "type": "object",
        "description": "Payload lệnh theo resource; không chứa actor/role do client tự khai.",
        "additionalProperties": true
      },
      "TopicRequirement": {
        "type": "object",
        "required": [
          "type",
          "value"
        ],
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "PREFERRED_GPA",
              "SKILL",
              "TECHNOLOGY",
              "KNOWLEDGE",
              "OTHER"
            ]
          },
          "value": {
            "type": "string"
          },
          "preferredGpa": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "maximum": 4
          },
          "mandatory": {
            "type": "boolean",
            "default": false
          }
        }
      },
      "TopicRequirementsRequest": {
        "type": "object",
        "required": [
          "requirements"
        ],
        "properties": {
          "requirements": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/TopicRequirement"
            }
          }
        }
      },
      "RegistrationMember": {
        "type": "object",
        "required": [
          "studentId",
          "isCoordinator"
        ],
        "properties": {
          "studentId": {
            "type": "string",
            "format": "uuid"
          },
          "isCoordinator": {
            "type": "boolean"
          }
        }
      },
      "RegistrationRequest": {
        "type": "object",
        "required": [
          "roundId",
          "topicId",
          "members"
        ],
        "properties": {
          "roundId": {
            "type": "string",
            "format": "uuid"
          },
          "topicId": {
            "type": "string",
            "format": "uuid"
          },
          "members": {
            "type": "array",
            "minItems": 1,
            "maxItems": 3,
            "items": {
              "$ref": "#/components/schemas/RegistrationMember"
            }
          }
        }
      },
      "AttendanceEntry": {
        "type": "object",
        "required": [
          "councilMemberId",
          "present"
        ],
        "properties": {
          "councilMemberId": {
            "type": "string",
            "format": "uuid"
          },
          "present": {
            "type": "boolean"
          },
          "note": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "AttendanceRequest": {
        "type": "object",
        "required": [
          "entries"
        ],
        "properties": {
          "entries": {
            "type": "array",
            "minItems": 5,
            "maxItems": 5,
            "items": {
              "$ref": "#/components/schemas/AttendanceEntry"
            }
          }
        }
      },
      "EvaluationItem": {
        "type": "object",
        "required": [
          "criterionId",
          "points"
        ],
        "properties": {
          "criterionId": {
            "type": "string",
            "format": "uuid"
          },
          "points": {
            "type": "number",
            "minimum": 0
          },
          "comment": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "EvaluationRequest": {
        "type": "object",
        "required": [
          "thesisMemberId",
          "items"
        ],
        "properties": {
          "thesisMemberId": {
            "type": "string",
            "format": "uuid"
          },
          "items": {
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "#/components/schemas/EvaluationItem"
            }
          },
          "comment": {
            "type": [
              "string",
              "null"
            ]
          },
          "version": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 1
          }
        }
      },
      "AiChatRequest": {
        "type": "object",
        "required": [
          "question"
        ],
        "properties": {
          "question": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4000
          },
          "roundId": {
            "type": [
              "string",
              "null"
            ],
            "format": "uuid"
          }
        }
      }
    }
  }
}